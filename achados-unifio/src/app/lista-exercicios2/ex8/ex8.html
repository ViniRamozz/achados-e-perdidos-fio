<table>
  <thead>
    <tr>
      <th>Posição</th>
      <th>Nome</th>
      <th>Preço</th>
      <th>Quantidade</th>
      <th>Total em Estoque</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let produto of produtos; let i = index">
      <td>{{ i + 1 }}</td>
      
      <td>{{ produto.nome }}</td>
      
      <td>{{ produto.preco | currency:'BRL' }}</td>
      
      <td>{{ produto.quantidade }}</td>
      
      <td>{{ (produto.preco * produto.quantidade) | currency:'BRL' }}</td>
    </tr>
  </tbody>
</table>
