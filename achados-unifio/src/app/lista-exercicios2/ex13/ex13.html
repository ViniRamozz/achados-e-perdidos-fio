<p>Total de tarefas: {{ totalTarefas }} | Concluídas: {{ totalConcluidas }} | Pendentes: {{ totalPendentes }}</p>

<p *ngIf="tarefas.length === 0">Nenhuma tarefa encontrada.</p>

<ul *ngIf="tarefas.length > 0">
  <li *ngFor="let tarefa of tarefas"
      [ngClass]="{
        'prioridade-baixa': tarefa.prioridade === 'baixa',
        'prioridade-media': tarefa.prioridade === 'média',
        'prioridade-alta': tarefa.prioridade === 'alta',
        'concluida': tarefa.concluida
      }">
    {{ tarefa.titulo }} - Responsável: {{ tarefa.responsavel }} - Prioridade: {{ tarefa.prioridade }} -
    Status: {{ tarefa.concluida ? 'Concluída' : 'Pendente' }}
    <button (click)="alternarSituacao(tarefa)">
      Marcar como {{ tarefa.concluida ? 'Pendente' : 'Concluída' }}
    </button>
  </li>
</ul>
