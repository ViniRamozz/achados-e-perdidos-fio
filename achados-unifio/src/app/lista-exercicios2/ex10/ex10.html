<ul>
  <li *ngFor="let produto of produtos">
    <span [style.font-weight]="produto.promocao ? 'bold' : 'normal'">
      {{ produto.nome }}
    </span> -
    <span [ngStyle]="{ 'color': produto.promocao ? 'red' : 'black' }">
      {{ produto.preco | currency:'BRL' }}
    </span>
    <span *ngIf="produto.promocao"> - Produto em promoção!</span>
    <button (click)="alternarPromocao(produto)">Alternar Promoção</button>
  </li>
</ul>
